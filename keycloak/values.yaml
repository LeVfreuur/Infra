# Keycloak + PostgreSQL - Bitnami Helm chart
# Homelab / test uniquement : les mots de passe "abcd" sont publics et faibles.
# Les autres parametres sont herites des valeurs par defaut du chart Helm.

global:
  security:
    # Necessaire pour autoriser les images Bitnami Legacy avec ce chart.
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0

# Compte administrateur initialise au premier demarrage.
auth:
  adminUser: user
  adminPassword: "abcd"
  # Ne pas confondre un mot de passe avec un nom de Secret existant.
  existingSecret: ""
  passwordSecretKey: ""

# Mode HTTP pour ce test local (pas d'exposition sur Internet).
production: false
tls:
  enabled: false
  existingSecret: ""
  passwordsSecret: ""
trustedCertsExistingSecret: ""

proxyHeaders: ""
hostnameStrict: false
httpRelativePath: "/"

# Pas de configuration externe de Keycloak ni de Secret additionnel.
extraEnvVars: []
extraEnvVarsSecret: ""

replicaCount: 1
cache:
  enabled: true
  stack: jdbc-ping

# Laisser le temps au processus Java de demarrer avant les probes normales.
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: keycloak.vlab.pnc
  tls: false

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true

keycloakConfigCli:
  enabled: false

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r0
  auth:
    postgresPassword: "abcd"
    username: bn_keycloak
    password: "abcd"
    database: bitnami_keycloak
    # Pas de Secret preexistant : Helm gere les Secrets du chart.
    existingSecret: ""
  architecture: standalone
  primary:
    persistence:
      enabled: true

# Fin de configuration : aucun Secret externe "abcd" n est attendu.
